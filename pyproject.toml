[project]
name = "finalproject-salakhetdinov-m26-555"
version = "0.1.0"
description = "Консольное приложение, имитирующее работу валютного кошелька"
readme = "README.md"
authors = [
    { name = "Damir Salakhetdinov", email = "saldam@inbox.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
finalproject-salakhetdinov-m26-555 = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]